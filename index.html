function recordNew(){state.step=0;state.record='idle';goTo(2);}

function renderCountry(){const c=countries.find(c=>c.id===state.country)||countries[0];$('countryName').textContent=c.name;$('countryFlag').textContent=c.flag;$('countryLanguages').innerHTML=c.codes.filter(code=>byISO.has(code)).map(code=>rowLanguage(byISO.get(code))).join('')}
const landingUrl=()=>`https://talk.bible/${state.iso}`;
function matrixSVG(){const m=qrMatrices[state.iso]||qrMatrices.swh;let paths='';for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]==='1')paths+=`M${x} ${y}h1v1h-1z`;return `<svg viewBox="0 0 ${m.length} ${m.length}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code for ${esc(landingUrl())}" shape-rendering="crispEdges"><rect width="${m.length}" height="${m.length}" fill="#fff"/><path fill="#103e32" d="${paths}"/></svg>`}
function qrCanvas(){const m=qrMatrices[state.iso]||qrMatrices.swh;const scale=12;let canvas=document.createElement('canvas');canvas.width=m.length*scale;canvas.height=m.length*scale;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle='#103e32';m.forEach((row,y)=>[...row].forEach((cell,x)=>{if(cell==='1')c.fillRect(x*scale,y*scale,scale,scale)}));return canvas}
function qrFile(){const data=qrCanvas().toDataURL('image/png').split(',')[1];const raw=atob(data);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new File([bytes],`talk-bible-${state.iso}.png`,{type:'image/png'})}
function downloadQR(){const canvas=qrCanvas(),a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`talk-bible-${state.iso}.png`;a.style.display='none';document.body.appendChild(a);a.click();a.remove()}
async function copyUrl(){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(landingUrl());else{const input=document.createElement('textarea');input.value=landingUrl();input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();document.execCommand('copy');input.remove()}toast('Copied')}catch(err){toast('QR')}}
async function sharePage(){const info={title:'talk.bible',url:landingUrl()};if(navigator.share){try{await navigator.share(info);return}catch(err){if(err.name==='AbortError')return}}await copyUrl()}
async function shareQR(){if(navigator.share){try{const file=qrFile();if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'talk.bible'});return}await navigator.share({title:'talk.bible',url:landingUrl()});return}catch(err){if(err.name==='AbortError')return}}downloadQR()}
function bookIllustration(){return `<div class="preview-book"><svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg"><path d="M17 35q78-25 133 14 65-38 133-14v165q-73-22-133 16-62-36-133-16Z" fill="#fff" stroke="#aad5b7" stroke-width="5"/><path d="M150 49v166" stroke="#86c1a1" stroke-width="4"/><g stroke="#bbd6c1" stroke-width="5" stroke-linecap="round"><path d="M34 72q48-12 98 10M34 95q48-12 98 10M34 118q48-12 98 10M34 141q48-12 98 10M168 81q43-20 99-8M168 106q43-20 99-8M168 131q43-20 99-8M168 156q43-20 99-8"/></g></svg></div>`}
function resourceSheet(type){const title={app:'Bible app',video:'Movie',audio:'Audio',text:'Text'}[type]||'Bible app';const visual=type==='video'?`<div class="preview-film"><button type="button" class="preview-play" id="previewPlay" aria-label="Preview video">${icon('play')}</button></div>`:type==='audio'?`<div class="preview-audio">${icon('headphones')}</div>`:bookIllustration();return `<div class="handle"></div><div class="sheet-top"><strong>${title}</strong><button type="button" class="sheet-close" data-close aria-label="Close">${icon('close')}</button></div><div class="resource-preview ${type==='video'?'video':''}">${visual}</div><button type="button" class="preview-next" id="previewNext">${icon(type==='video'?'play':'arrow')}${type==='video'?'Play':'Open'}</button>`}
function openSheet(type){state.sheet=type;previewPage=0;let markup;if(type==='switch'){markup=`<div class="handle"></div><div class="sheet-top"><strong> </strong><button type="button" class="sheet-close" data-close aria-label="Close">${icon('close')}</button></div><a href="#s1" class="sheet-option" data-nav="1"><span class="symbol">${icon('mic')}</span>TALK${icon('chev')}</a><a href="#s6" class="sheet-option" data-nav="6"><span class="symbol">${icon('globe')}</span>LANG${icon('chev')}</a>`}else if(type==='qr'){markup=`<div class="handle"></div><div class="sheet-top"><strong>QR</strong><button type="button" class="sheet-close" data-close aria-label="Close">${icon('close')}</button></div><div class="qr-display"><div class="qr-matrix" id="qrMatrix">${matrixSVG()}</div><span>${esc((byISO.get(state.iso)||byISO.get('swh')).native)}</span></div><div class="qr-buttons"><button type="button" id="shareQR">${icon('share')}Share</button><button type="button" id="downloadQR">${icon('download')}Download</button></div>`}else{markup=resourceSheet(type)}$('sheet').innerHTML=markup;$('scrim').classList.add('open');$('scrim').setAttribute('aria-hidden','false');updateJump(type==='qr'?4:type==='switch'?5:3)}
function previewNext(){previewPage++;const current=state.sheet;if(current==='video'){let play=$('previewPlay');if(play){play.classList.toggle('playing');play.innerHTML=icon(play.classList.contains('playing')?'pause':'play')}}else{const book=$('sheet').querySelector('.preview-book');if(book){book.style.transform=`rotate(${previewPage%2?'-5':'3'}deg)`;book.style.transition='transform .4s'}}}
document.addEventListener('click',event=>{
 const elem=event.target.closest('button,a');if(!elem)return;
 if(elem.tagName==='A' && elem.getAttribute('href')?.startsWith('#s'))event.preventDefault();
 if(elem.hasAttribute('data-close')){closeSheet();return}
 if(elem.hasAttribute('data-jump')){let n=Number(elem.dataset.jump);if(n===4||n===5){goTo(3);openSheet(n===4?'qr':'switch')}else{if(n===2){state.step=0;state.record='idle'}if(n===7)state.country='kenya';goTo(n)}return}
 if(elem.hasAttribute('data-language')){selectLanguage(elem.dataset.language);return}
 if(elem.hasAttribute('data-country')){openCountry(elem.dataset.country);return}
 if(elem.hasAttribute('data-resource')){openSheet(elem.dataset.resource);return}
 if(elem.hasAttribute('data-back')){const prev=state.history.pop();if(prev!==undefined)goTo(prev,{noHistory:true});else goTo(0,{noHistory:true});return}
 if(elem.hasAttribute('data-nav')){if(elem.hasAttribute('data-start-record'))recordNew();else{if(elem.hasAttribute('data-country-back'))state.tab='countries';if(elem.dataset.nav==='6'&&!elem.hasAttribute('data-country-back'))setTab('languages');goTo(Number(elem.dataset.nav))}return}
 switch(elem.id){case 'recordToggle':toggleRecord();break;case 'approve':approveRecord();break;case 'redo':state.record='idle';renderRecord();break;
 case 'switchLanguage':openSheet('switch');break;case 'moreToggle':state.more=!state.more;renderLanding();break;case 'sharePage':sharePage();break;case 'qrOpen':openSheet('qr');break;case 'langTab':setTab('languages');break;case 'mapTab':setTab('countries');break;
 case 'clearLookup':$('lookup').value='';$('clearLookup').classList.remove('show');renderDirectory();break;
 case 'shareQR':shareQR();break;case 'downloadQR':downloadQR();break;case 'previewNext':case 'previewPlay':previewNext();break;}
});
$('lookup').addEventListener('input',()=>{$('clearLookup').classList.toggle('show',Boolean($('lookup').value));renderDirectory()});
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.sheet)closeSheet();else if(state.screen!==0)goTo(0)}});
// If opened with a direct #sN link, show that screen. Anchor links also
// provide basic screen navigation in iPhone viewers that restrict scripts.
const initial=location.hash.match(/^#s([012367])$/);if(initial){const n=Number(initial[1]);try{history.replaceState(null,'',location.pathname+location.search)}catch(err){}goTo(n,{noHistory:true})}else goTo(0,{noHistory:true});
})();
</script>
</body>
